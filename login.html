<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>CloudFix Admin Login</title>

<link rel="stylesheet"
href="/src/styles/login.css">

</head>

<body>

<div class="login-card">

<div class="logo">

Cloud<span>Fix</span>

</div>

<p class="subtitle">

Administrator Portal

</p>

<form id="loginForm">

<div class="form-group">

<label>Email</label>

<input
type="email"
id="email"
required>

</div>

<div class="form-group">

<label>Password</label>

<input
type="password"
id="password"
required>

</div>

<button
type="submit"
class="login-btn">

Login

</button>

<div
id="loginError"
class="error">

</div>

</form>

</div>

<script
type="module"
src="/src/components/auth/login.js">
</script>

</body>

</html>
